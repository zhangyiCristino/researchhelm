[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "researchhelm"
version = "3.2.0"
description = "Human-governed research protocol toolchain: validate, render, audit, sanitize, init, doctor"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yi Zhang" }]
keywords = ["claude-code", "ai-agents", "research", "human-in-the-loop", "reproducible-research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.scripts]
researchhelm = "researchhelm_cli:main"

[project.urls]
Homepage = "https://github.com/zhangyiCristino/researchhelm"
Repository = "https://github.com/zhangyiCristino/researchhelm"
Issues = "https://github.com/zhangyiCristino/researchhelm/issues"

[tool.setuptools]
packages = ["researchhelm_cli"]

[tool.setuptools.package-data]
researchhelm_cli = [
    "py.typed",
    "bundled/scripts/*.py",
    "bundled/root/*.py",
    "bundled/fixtures/minimal-valid-run/*",
]
